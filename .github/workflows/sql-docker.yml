name: Lint SQL Server Scripts

on:
  push:
    paths:
      - 'Geodynamics/MigrationScripts/**'
  pull_request:
    paths:
      - 'Geodynamics/MigrationScripts/**'

jobs:
  sql-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Start SQL Server
        run: |
          docker run -e "ACCEPT_EULA=Y" -e "MSSQL_SA_PASSWORD=YourStrong!Passw0rd" \
            -p 1433:1433 -d --name sqltest mcr.microsoft.com/mssql/server:2022-latest

      - name: Wait for SQL Server
        shell: bash
        run: |
          for i in {1..30}; do
            if docker exec sqltest /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "YourStrong!Passw0rd" -C \
              -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server is ready"
              break
            fi
            echo "Waiting for SQL Server..."
            sleep 2
          done

      - name: Run SQL scripts in order
        shell: bash
        run: |
          SCRIPTS=(
            "Geodynamics/MigrationScripts/Apply.sql"
            "Geodynamics/MigrationScripts/Rollback.sql"
          )
      
          for f in "${SCRIPTS[@]}"; do
            echo "Running $f"
            cat "$f" | docker exec -i sqltest \
              /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "YourStrong!Passw0rd" -C \
              || exit 1
          done



