name: Lint SQL Server Scripts

on: [push, pull_request]

jobs:
  lint:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SQLFluff
        run: pip install sqlfluff

      - name: Run SQLFluff (T-SQL)
        run: sqlfluff lint Geodynamics/MigrationScripts/*.sql 
